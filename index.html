          }

  <style>
    :root {
      --bg-primary: #1a1a1a;
      --bg-card: rgba(34, 34, 34, 0.6);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.15);
      --accent-purple: #a855f7;
      --accent-orange: #fb923c;
      --accent-pink: #ec4899;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
    }
    
    * {
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
    }
    
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    
    /* Glassmorphism Card */
    .glass-card {
      background: linear-gradient(145deg, rgba(40, 40, 40, 0.6), rgba(20, 20, 20, 0.8));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    
    .glass-card-light {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
    }
    
    /* Animated Gradient Orbs */
    .gradient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: float 20s ease-in-out infinite;
    }
    
    .gradient-orb-1 {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      top: -200px;
      right: -100px;
      animation-delay: 0s;
    }
    
    .gradient-orb-2 {
      width: 350px;
      height: 350px;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-pink));
      bottom: -150px;
      left: -100px;
      animation-delay: -10s;
    }
    
    .gradient-orb-3 {
      width: 250px;
      height: 250px;
      background: linear-gradient(135deg, var(--accent-purple), #3b82f6);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -5s;
      opacity: 0.2;
    }
    
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -30px) scale(1.05); }
      50% { transform: translate(-20px, 20px) scale(0.95); }
      75% { transform: translate(20px, 10px) scale(1.02); }
    }
    
    /* Rotating Border Gradient */
    .rotating-border {
      position: relative;
      overflow: hidden;
    }
    
    .rotating-border::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: conic-gradient(
        from 0deg,
        var(--accent-purple),
        var(--accent-orange),
        var(--accent-pink),
        var(--accent-purple)
      );
      animation: rotate-border 8s linear infinite;
      border-radius: inherit;
      z-index: -1;
    }
    
    .rotating-border::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: var(--bg-primary);
      border-radius: inherit;
      z-index: -1;
    }
    
    @keyframes rotate-border {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    /* Button Styles */
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-pink));
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .btn-primary:hover::before {
      opacity: 1;
    }
    
    .btn-primary span {
      position: relative;
      z-index: 1;
    }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-medium);
      transition: all 0.3s ease;
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-purple);
    }
    
    /* Input Styles */
    .input-field {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-subtle);
      transition: all 0.3s ease;
    }
    
    .input-field:focus {
      outline: none;
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    
    ::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, 0.4);
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(168, 85, 247, 0.6);
    }
    
    /* Page Transitions */
    .page-enter {
      animation: pageEnter 0.4s ease forwards;
    }
    
    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Stagger Animation */
    .stagger-item {
      opacity: 0;
      animation: staggerFadeIn 0.5s ease forwards;
    }
    
    @keyframes staggerFadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Pulse Animation */
    .pulse-dot {
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.7; }
    }
    
    /* Progress Ring */
    .progress-ring {
      transform: rotate(-90deg);
    }
    
    .progress-ring circle {
      transition: stroke-dashoffset 0.5s ease;
    }
    
    /* Checkbox Custom */
    .custom-checkbox {
      appearance: none;
      width: 24px;
      height: 24px;
      border: 2px solid var(--border-medium);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }
    
    .custom-checkbox:checked {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      border-color: transparent;
    }
    
    .custom-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 7px;
      top: 3px;
      width: 6px;
      height: 12px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    
    /* Calendar Day */
    .calendar-day {
      transition: all 0.2s ease;
    }
    
    .calendar-day:hover {
      background: rgba(168, 85, 247, 0.1);
    }
    
    .calendar-day.has-workout {
      position: relative;
    }
    
    .calendar-day.has-workout::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-orange));
    }
    
    .calendar-day.today {
      border: 1px solid var(--accent-purple);
    }
    
    .calendar-day.selected {
      background: rgba(168, 85, 247, 0.2);
    }
    
    /* Tab Indicator */
    .tab-indicator {
      position: absolute;
      bottom: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-orange));
      border-radius: 2px;
      transition: all 0.3s ease;
    }
    
    /* Skeleton Loading */
    .skeleton {
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.05) 0%,
        rgba(255, 255, 255, 0.1) 50%,
        rgba(255, 255, 255, 0.05) 100%
      );
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
    }
    
    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    /* Bottom Nav */
    .nav-item {
      transition: all 0.3s ease;
    }
    
    .nav-item.active {
      color: var(--accent-purple);
    }
    
    .nav-item.active .nav-indicator {
      width: 4px;
      height: 4px;
      background: var(--accent-purple);
      border-radius: 50%;
    }
    
    /* Modal */
    .modal-backdrop {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
    }
    
    .modal-content {
      animation: modalSlideIn 0.3s ease;
    }
    
    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    /* Workout Card Glow */
    .workout-card {
      position: relative;
    }
    
    .workout-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      background: linear-gradient(135deg, 
        rgba(168, 85, 247, 0.3), 
        transparent, 
        rgba(251, 146, 60, 0.3)
      );
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }
    
    .workout-card:hover::before {
      opacity: 1;
    }
    
    /* Badge */
    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .badge-purple {
      background: rgba(168, 85, 247, 0.2);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }
    
    .badge-orange {
      background: rgba(251, 146, 60, 0.2);
      color: #fdba74;
      border: 1px solid rgba(251, 146, 60, 0.3);
    }
    
    .badge-green {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    
    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    
    /* Mobile optimizations */
    @media (max-width: 640px) {
      .gradient-orb {
        filter: blur(60px);
        opacity: 0.3;
      }
      
      .gradient-orb-1 {
        width: 250px;
        height: 250px;
      }
      
      .gradient-orb-2 {
        width: 200px;
        height: 200px;
      }
      
      .gradient-orb-3 {
        width: 150px;
        height: 150px;
      }
    }
  </style>
</head>

    const CATEGORIES = [...new Set(EXERCISES_DB.map(e => e.category))];
    
    // ==========================================
    // STORAGE MANAGER
    // ==========================================
    
    const Storage = {
      KEYS: {
        AUTH: 'fitplanner_auth',
        WORKOUTS: 'fitplanner_workouts',
        CALENDAR: 'fitplanner_calendar',
        HISTORY: 'fitplanner_history'
      },
      
      get(key) {
        try {
          const data = localStorage.getItem(key);
          return data ? JSON.parse(data) : null;
        } catch (e) {
          console.error('Storage get error:', e);
          return null;
        }
      },
      
      set(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (e) {
          console.error('Storage set error:', e);
          return false;
        }
      },
      
      remove(key) {
        localStorage.removeItem(key);
      }
    };
    
    // ==========================================
    // STATE MANAGEMENT
    // ==========================================
    
    const AppState = {
      isAuthenticated: false,
      user: null,
      currentView: 'auth',
      currentTab: 'workouts',
      userWorkouts: [],
      calendar: {},
      history: [],
      selectedDate: null,
      editingWorkout: null,
      activeSession: null,
      modal: null,
      
      listeners: [],
      
      subscribe(fn) {
        this.listeners.push(fn);
        return () => {
          this.listeners = this.listeners.filter(l => l !== fn);
        };
      },
      
      notify() {
        this.listeners.forEach(fn => fn(this));
      },
      
      update(changes) {
        Object.assign(this, changes);
        this.notify();
      }
    };
    
    // Initialize state from storage
    function initializeState() {
      const auth = Storage.get(Storage.KEYS.AUTH);
      const workouts = Storage.get(Storage.KEYS.WORKOUTS) || [];
      const calendar = Storage.get(Storage.KEYS.CALENDAR) || {};
      const history = Storage.get(Storage.KEYS.HISTORY) || [];
      
      AppState.update({
        isAuthenticated: auth?.isAuthenticated || false,
        user: auth?.user || null,
        currentView: auth?.isAuthenticated ? 'main' : 'auth',
        userWorkouts: workouts,
        calendar: calendar,
        history: history
      });
    }
    
    // ==========================================
    // UTILITY FUNCTIONS
    // ==========================================
    
    function generateId() {
      return 'id_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
    }
    
    function formatDate(date) {
      const d = new Date(date);
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    }
    
    function formatDateFull(date) {
      const d = new Date(date);
      return d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    
    function getDateKey(date) {
      const d = new Date(date);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    
    function getMonthDays(year, month) {
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const days = [];
      
      // Add padding days from previous month
      let startPadding = firstDay.getDay() - 1;
      if (startPadding < 0) startPadding = 6;
      
      for (let i = startPadding; i > 0; i--) {
        const d = new Date(year, month, 1 - i);
        days.push({ date: d, currentMonth: false });
      }
      
      // Add month days
      for (let i = 1; i <= lastDay.getDate(); i++) {
        days.push({ date: new Date(year, month, i), currentMonth: true });
      }
      
      // Add padding days from next month
      const remaining = 42 - days.length;
      for (let i = 1; i <= remaining; i++) {
        days.push({ date: new Date(year, month + 1, i), currentMonth: false });
      }
      
      return days;
    }
    
    function debounce(fn, delay) {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn(...args), delay);
      };
    }

      let content = '';
      
      switch (AppState.currentView) {
        case 'auth':
          content = renderAuthScreen();
          break;
        case 'main':
          content = renderMainScreen();
          break;
        case 'workout-builder':
          content = renderWorkoutBuilder();

    // ==========================================
    
    function renderCalendarTab() {
      const today = new Date();
      const viewDate = AppState.calendarViewDate || today;
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      
      const days = getMonthDays(year, month);
      const weekDays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 
                          'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
      
      return `
        <div class="page-enter">
          <!-- Header -->
          <div class="mb-6">
            <h1 class="font-mono text-2xl font-bold text-gray-100 mb-1">Календарь</h1>
            <p class="text-gray-400 text-sm">Планируйте тренировки на любой день</p>
          </div>
          
          <!-- Calendar Card -->
          <div class="glass-card rounded-2xl p-4 md:p-6">
            <!-- Month Navigation -->
            <div class="flex items-center justify-between mb-6">
              <button 
                class="p-2 rounded-lg hover:bg-white/10 text-gray-400 hover:text-gray-200 transition-colors"
                id="prev-month"
              >
                ${Icons.chevronLeft}
              </button>
              
              <h2 class="font-mono text-lg font-semibold text-gray-100">
                ${monthNames[month]} ${year}
              </h2>
              
              <button 
                class="p-2 rounded-lg hover:bg-white/10 text-gray-400 hover:text-gray-200 transition-colors"
                id="next-month"
              >
                ${Icons.chevronRight}
              </button>
            </div>
            
            <!-- Week Days Header -->
            <div class="grid grid-cols-7 gap-1 mb-2">
              ${weekDays.map(day => `
                <div class="text-center text-xs text-gray-500 font-medium py-2">${day}</div>
              `).join('')}
            </div>
            
            <!-- Days Grid -->
            <div class="grid grid-cols-7 gap-1">
              ${days.map(({ date, currentMonth }) => {
                const dateKey = getDateKey(date);
                const isToday = getDateKey(today) === dateKey;
                const isSelected = AppState.selectedDate === dateKey;
                const workoutPlan = AppState.calendar[dateKey];
                const hasWorkout = !!workoutPlan;
                const isCompleted = workoutPlan?.completed;
                
                return `
                  <button 
                    class="calendar-day aspect-square rounded-xl flex items-center justify-center text-sm font-medium relative
                      ${currentMonth ? 'text-gray-200' : 'text-gray-600'}
                      ${isToday ? 'today' : ''}
                      ${isSelected ? 'selected' : ''}
                      ${hasWorkout ? 'has-workout' : ''}
                      ${isCompleted ? 'opacity-60' : ''}
                    "
                    data-date="${dateKey}"
                  >
                    ${date.getDate()}
                    ${isCompleted ? `
                      <span class="absolute top-1 right-1 w-2 h-2 bg-green-500 rounded-full"></span>
                    ` : ''}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
          
          <!-- Selected Date Info -->
          ${AppState.selectedDate ? renderSelectedDateInfo() : ''}
        </div>
      `;
    }
    
    function renderSelectedDateInfo() {
      const dateKey = AppState.selectedDate;
      const workoutPlan = AppState.calendar[dateKey];
      const dateObj = new Date(dateKey);
      const dateStr = formatDateFull(dateObj);
      
      return `
        <div class="mt-4 glass-card-light rounded-2xl p-4 stagger-item" style="animation-delay: 0.1s">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h3 class="font-mono text-sm font-semibold text-gray-200 capitalize">${dateStr}</h3>
            </div>
            ${workoutPlan ? `
              <span class="badge ${workoutPlan.completed ? 'badge-green' : 'badge-purple'}">

            ` : ''}
          </div>
          
          ${workoutPlan ? `
            ${(() => {
              const workout = AppState.userWorkouts.find(w => w.id === workoutPlan.workoutId);
              if (!workout) return '<p class="text-gray-500 text-sm">Тренировка удалена</p>';
              
              return `
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500/20 to-orange-400/20 flex items-center justify-center">
                      <span class="w-5 h-5 text-purple-400">${Icons.dumbbell}</span>

                      class="btn-primary px-4 py-2 rounded-xl text-sm font-medium text-white flex items-center gap-2"

                      <span class="w-4 h-4">${Icons.play}</span>
                      <span>Начать</span>
                    </button>
                  ` : `
                    <div class="text-right">
                      <p class="text-sm text-green-400 font-medium">Выполнено</p>
                      <p class="text-xs text-gray-500">${workoutPlan.progress}% прогресс</p>

                  `}
                </div>

            })()}
          ` : `

              <p class="text-gray-500 text-sm mb-3">Нет запланированной тренировки</p>
              <button 
                class="btn-secondary px-4 py-2 rounded-xl text-sm font-medium text-gray-300"

              </button>
            </div>
          `}
        </div>
      `;
    }
    
    // ==========================================
    // STATS TAB
    // ==========================================
    
    function renderStatsTab() {
      const history = AppState.history || [];
      const completedWorkouts = history.filter(h => h.completed).length;
      const totalExercises = history.reduce((sum, h) => sum + (h.exercisesCompleted || 0), 0);
      
      // Calculate streak
      let streak = 0;
      const today = new Date();
      for (let i = 0; i < 30; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const key = getDateKey(d);
        if (AppState.calendar[key]?.completed) {
          streak++;
        } else if (i > 0) {
          break;
        }
      }
      
      return `
        <div class="page-enter">
          <!-- Header -->
          <div class="mb-6">
            <h1 class="font-mono text-2xl font-bold text-gray-100 mb-1">Статистика</h1>
            <p class="text-gray-400 text-sm">Ваш прогресс и достижения</p>
          </div>
          
          <!-- Stats Grid -->
          <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="glass-card-light rounded-2xl p-4 stagger-item" style="animation-delay: 0s">
              <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500/20 to-pink-500/20 flex items-center justify-center">
                  <span class="w-5 h-5 text-orange-400">${Icons.fire}</span>
                </div>
              </div>
              <p class="font-mono text-2xl font-bold text-gray-100">${streak}</p>
              <p class="text-xs text-gray-500">Дней подряд</p>

    // ==========================================
    // WORKOUT BUILDER

    function renderWorkoutBuilder() {
      const workout = AppState.editingWorkout || { name: '', exercises: [] };
      const searchQuery = AppState.exerciseSearch || '';
      const selectedCategory = AppState.selectedCategory || 'all';
      
      const filteredExercises = EXERCISES_DB.filter(e => {
        const matchesSearch = e.name.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesCategory = selectedCategory === 'all' || e.category === selectedCategory;
        return matchesSearch && matchesCategory;
      });
      
      return `
        <div class="min-h-screen flex flex-col relative z-10">
          <!-- Header -->
          <header class="p-4 md:p-6 glass-card-light border-b border-white/5">

                id="back-to-main"
                class="p-2 rounded-lg hover:bg-white/10 text-gray-400 hover:text-gray-200 transition-colors"
              >
                ${Icons.arrowLeft}

              <div class="flex-1">
                <input 
                  type="text"
                  id="workout-name-input"

                  placeholder="Название тренировки"

              </div>
              <button 
                id="save-workout"
                class="btn-primary px-4 py-2 rounded-xl text-sm font-medium text-white ${workout.name.trim() && workout.exercises.length > 0 ? '' : 'opacity-50'}"

            <div class="max-w-4xl mx-auto px-4 md:px-6 py-6">

                <div class="mb-6">

                  </h3>
                  <div class="space-y-2">

                  <button 
                    class="category-btn flex-shrink-0 px-4 py-2 rounded-xl text-sm font-medium transition-all
                      ${selectedCategory === cat ? 'bg-purple-500/20 text-purple-300 border border-purple-500/30' : 'bg-white/5 text-gray-400 hover:bg-white/10'}"

                ${filteredExercises.map((exercise, index) => {
                  const isAdded = workout.exercises.some(e => e.exerciseId === exercise.id);
                  
                  return `
                    <button 
                      class="w-full glass-card-light rounded-xl p-4 text-left hover:bg-white/5 transition-all flex items-center justify-between group stagger-item ${isAdded ? 'opacity-50' : ''}"

                          <span class="text-xs text-gray-500">${exercise.muscle}</span>

    // ==========================================
    // WORKOUT SESSION
    // ==========================================
    
    function renderWorkoutSession() {
      const session = AppState.activeSession;
      if (!session) return '';
      
      const workout = AppState.userWorkouts.find(w => w.id === session.workoutId);
      if (!workout) return '';
      
      const completedCount = session.exercises.filter(e => e.completed).length;
      const totalCount = session.exercises.length;
      const progress = Math.round((completedCount / totalCount) * 100);
      
      return `
        <div class="min-h-screen flex flex-col relative z-10">
          <!-- Header -->
          <header class="p-4 md:p-6 glass-card-light border-b border-white/5">
            <div class="max-w-4xl mx-auto">
              <div class="flex items-center justify-between mb-4">
                <button 
                  id="exit-session"
                  class="p-2 rounded-lg hover:bg-white/10 text-gray-400 hover:text-gray-200 transition-colors"
                >
                  ${Icons.x}
                </button>
                
                <div class="flex items-center gap-2">
                  <span class="font-mono text-2xl font-bold text-gray-100">${progress}%</span>
                </div>
                
                <button 
                  id="finish-session"
                  class="btn-primary px-4 py-2 rounded-xl text-sm font-medium text-white"
                >
                  <span>Завершить</span>
                </button>
              </div>
              
              <!-- Progress Bar -->
              <div class="h-2 bg-white/5 rounded-full overflow-hidden">
                <div 
                  class="h-full bg-gradient-to-r from-purple-500 to-pink-500 transition-all duration-500"
                  style="width: ${progress}%"
                ></div>
              </div>
              
              <div class="mt-2 flex items-center justify-between text-xs text-gray-500">
                <span>${workout.name}</span>
                <span>${completedCount} из ${totalCount}</span>
              </div>
            </div>
          </header>
          
          <!-- Content -->
          <main class="flex-1 overflow-y-auto pb-8">
            <div class="max-w-4xl mx-auto px-4 md:px-6 py-6">
              <div class="space-y-3">
                ${session.exercises.map((ex, index) => {
                  const exercise = EXERCISES_DB.find(e => e.id === ex.exerciseId);
                  if (!exercise) return '';
                  
                  const workoutEx = workout.exercises.find(w => w.exerciseId === ex.exerciseId);
                  
                  return `
                    <div 
                      class="glass-card rounded-2xl p-4 ${ex.completed ? 'opacity-60' : ''} stagger-item"
                      style="animation-delay: ${index * 0.05}s"
                    >
                      <div class="flex items-start gap-4">
                        <input 
                          type="checkbox"
                          class="custom-checkbox flex-shrink-0 mt-1"
                          data-toggle-exercise="${index}"
                          ${ex.completed ? 'checked' : ''}
                        >
                        
                        <div class="flex-1">
                          <div class="flex items-start justify-between mb-2">
                            <div>
                              <h4 class="font-medium text-gray-100 ${ex.completed ? 'line-through' : ''}">${exercise.name}</h4>
                              <span class="text-xs text-gray-500">${exercise.category}</span>
                            </div>
                          </div>
                          
                          <div class="flex flex-wrap gap-3">
                            <div class="flex items-center gap-2">
                              <span class="w-6 h-6 rounded-md bg-purple-500/20 flex items-center justify-center">
                                <span class="text-xs font-bold text-purple-400">${workoutEx?.sets || 3}</span>
                              </span>
                              <span class="text-xs text-gray-400">подходов</span>
                            </div>
                            <div class="flex items-center gap-2">
                              <span class="w-6 h-6 rounded-md bg-orange-500/20 flex items-center justify-center">
                                <span class="text-xs font-bold text-orange-400">${workoutEx?.reps || 10}</span>
                              </span>
                              <span class="text-xs text-gray-400">повторов</span>
                            </div>

    // ==========================================
    // EVENT LISTENERS
    // ==========================================
    
    function attachEventListeners() {
      // Auth Form
      const authForm = document.getElementById('auth-form');
      const authLoading = document.getElementById('auth-loading');
      
      if (authForm) {
        authForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          authForm.classList.add('hidden');
          authLoading.classList.remove('hidden');
          
          // Simulate loading
          await new Promise(r => setTimeout(r, 1500));
          
          const email = document.getElementById('auth-email').value || 'user@example.com';
          
          Storage.set(Storage.KEYS.AUTH, {
            isAuthenticated: true,
            user: { email }
          });
          
          AppState.update({
            isAuthenticated: true,
            user: { email },
            currentView: 'main'
          });
        });
        
        document.getElementById('register-btn')?.addEventListener('click', async () => {
          authForm.classList.add('hidden');
          authLoading.classList.remove('hidden');
          
          await new Promise(r => setTimeout(r, 1500));
          
          const email = document.getElementById('auth-email').value || 'user@example.com';
          
          Storage.set(Storage.KEYS.AUTH, {
            isAuthenticated: true,
            user: { email }
          });
          
          AppState.update({
            isAuthenticated: true,
            user: { email },
            currentView: 'main'
          });
        });
      }
      
      // Logout
      document.getElementById('logout-btn')?.addEventListener('click', () => {
        Storage.remove(Storage.KEYS.AUTH);
        AppState.update({
          isAuthenticated: false,
          user: null,
          currentView: 'auth'
        });
      });
      
      // Tab Navigation
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.dataset.tab;
          AppState.update({ currentTab: tab });
        });
      });
      
      // FAB - Add Workout
      document.getElementById('add-workout-fab')?.addEventListener('click', () => {
        AppState.update({
          currentView: 'workout-builder',
          editingWorkout: { name: '', exercises: [] },
          exerciseSearch: '',
          selectedCategory: 'all'
        });
      });
      
      document.getElementById('create-first-workout')?.addEventListener('click', () => {
        AppState.update({
          currentView: 'workout-builder',
          editingWorkout: { name: '', exercises: [] },
          exerciseSearch: '',
          selectedCategory: 'all'
        });
      });
      
      // Workout Builder
      document.getElementById('back-to-main')?.addEventListener('click', () => {
        AppState.update({
          currentView: 'main',
          editingWorkout: null
        });
      });
      
      document.getElementById('workout-name-input')?.addEventListener('input', (e) => {
        const workout = AppState.editingWorkout;
        if (workout) {
          workout.name = e.target.value;
        }
      });
      
      document.getElementById('save-workout')?.addEventListener('click', () => {
        const workout = AppState.editingWorkout;
        if (workout && workout.name.trim() && workout.exercises.length > 0) {
          const workouts = [...AppState.userWorkouts];
          
          if (workout.id) {
            const index = workouts.findIndex(w => w.id === workout.id);
            if (index !== -1) {
              workouts[index] = workout;
            }
          } else {
            workout.id = generateId();
            workouts.push(workout);
          }
          
          Storage.set(Storage.KEYS.WORKOUTS, workouts);
          AppState.update({
            userWorkouts: workouts,
            currentView: 'main',
            editingWorkout: null
          });
        }
      });
      
      // Exercise Search
      const searchInput = document.getElementById('exercise-search');
      if (searchInput) {
        searchInput.addEventListener('input', debounce((e) => {
          AppState.update({ exerciseSearch: e.target.value });
        }, 200));
      }
      
      // Category Filter
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          AppState.update({ selectedCategory: btn.dataset.category });
        });
      });
      
      // Add Exercise
      document.querySelectorAll('[data-add-exercise]').forEach(btn => {
        btn.addEventListener('click', () => {
          const exerciseId = parseInt(btn.dataset.addExercise);
          const workout = AppState.editingWorkout;
          
          if (workout && !workout.exercises.some(e => e.exerciseId === exerciseId)) {
            workout.exercises.push({
              exerciseId,
              sets: 3,
              reps: '10-12',
              weight: null
            });
            AppState.notify();
          }
        });
      });
      
      // Remove Exercise
      document.querySelectorAll('[data-remove-exercise]').forEach(btn => {
        btn.addEventListener('click', () => {
          const index = parseInt(btn.dataset.removeExercise);
          const workout = AppState.editingWorkout;
          
          if (workout) {
            workout.exercises.splice(index, 1);
            AppState.notify();
          }
        });
      });
      
      // Exercise Fields
      document.querySelectorAll('[data-exercise-index]').forEach(input => {
        input.addEventListener('input', (e) => {
          const index = parseInt(e.target.dataset.exerciseIndex);
          const field = e.target.dataset.field;
          const workout = AppState.editingWorkout;
          
          if (workout && workout.exercises[index]) {
            if (field === 'weight' || field === 'sets') {
              workout.exercises[index][field] = parseFloat(e.target.value) || null;
            } else {
              workout.exercises[index][field] = e.target.value;
            }
          }
        });
      });
      
      // Calendar Navigation
      document.getElementById('prev-month')?.addEventListener('click', () => {
        const current = AppState.calendarViewDate || new Date();
        const newDate = new Date(current);
        newDate.setMonth(newDate.getMonth() - 1);
        AppState.update({ calendarViewDate: newDate });
      });
      
      document.getElementById('next-month')?.addEventListener('click', () => {
        const current = AppState.calendarViewDate || new Date();
        const newDate = new Date(current);
        newDate.setMonth(newDate.getMonth() + 1);
        AppState.update({ calendarViewDate: newDate });
      });
      
      // Calendar Day Click
      document.querySelectorAll('.calendar-day').forEach(day => {
        day.addEventListener('click', () => {
          AppState.update({ selectedDate: day.dataset.date });
        });
      });
      
      // Assign Workout
      document.querySelectorAll('[data-assign-date]').forEach(btn => {
        btn.addEventListener('click', () => {
          AppState.update({
            modal: {
              type: 'assign-workout',
              date: btn.dataset.assignDate
            }
          });
        });
      });
      
      // Select Workout for Calendar
      document.querySelectorAll('[data-select-workout]').forEach(btn => {
        btn.addEventListener('click', () => {
          const workoutId = btn.dataset.selectWorkout;
          const date = AppState.modal?.date;
          
          if (date && workoutId) {
            const calendar = { ...AppState.calendar };
            calendar[date] = {
              workoutId,
              completed: false,
              progress: 0
            };
            
            Storage.set(Storage.KEYS.CALENDAR, calendar);
            AppState.update({
              calendar,
              modal: null
            });
          }
        });
      });
      
      // Start Workout
      document.querySelectorAll('[data-start-workout]').forEach(btn => {
        btn.addEventListener('click', () => {
          const workoutId = btn.dataset.startWorkout;
          const date = btn.dataset.date;
          const workout = AppState.userWorkouts.find(w => w.id === workoutId);
          
          if (workout) {
            AppState.update({
              currentView: 'workout-session',
              activeSession: {
                workoutId,
                date,
                exercises: workout.exercises.map(e => ({
                  exerciseId: e.exerciseId,
                  completed: false
                })),
                startTime: Date.now()
              }
            });
          }
        });
      });
      
      // Workout Session
      document.getElementById('exit-session')?.addEventListener('click', () => {
        const session = AppState.activeSession;
        if (session) {
          AppState.update({
            modal: {
              type: 'exit-session'
            }
          });
        }
      });
      
      document.getElementById('exit-session-confirm')?.addEventListener('click', () => {
        finishWorkoutSession();
      });
      
      document.getElementById('finish-session')?.addEventListener('click', () => {
        finishWorkoutSession();
      });
      
      // Toggle Exercise in Session
      document.querySelectorAll('[data-toggle-exercise]').forEach(checkbox => {
        checkbox.addEventListener('change', () => {
          const index = parseInt(checkbox.dataset.toggleExercise);
          const session = AppState.activeSession;
          
          if (session && session.exercises[index]) {
            session.exercises[index].completed = checkbox.checked;
            AppState.notify();
          }
        });
      });
      
      // Workout Actions
      document.querySelectorAll('.workout-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (!e.target.closest('.workout-edit') && !e.target.closest('.workout-delete')) {
            const workoutId = card.dataset.workoutId;
            const workout = AppState.userWorkouts.find(w => w.id === workoutId);
            
            if (workout) {
              AppState.update({
                currentView: 'workout-builder',
                editingWorkout: JSON.parse(JSON.stringify(workout)),
                exerciseSearch: '',
                selectedCategory: 'all'
              });
            }
          }
        });
      });
      
      document.querySelectorAll('.workout-edit').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const workoutId = btn.dataset.workoutId;
          const workout = AppState.userWorkouts.find(w => w.id === workoutId);
          
          if (workout) {
            AppState.update({
              currentView: 'workout-builder',
              editingWorkout: JSON.parse(JSON.stringify(workout)),
              exerciseSearch: '',
              selectedCategory: 'all'
            });
          }
        });
      });
      
      document.querySelectorAll('.workout-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const workoutId = btn.dataset.workoutId;
          
          AppState.update({
            modal: {
              type: 'confirm',
              title: 'Удалить тренировку?',
              message: 'Это действие нельзя отменить. Тренировка будет удалена из всех запланированных дат.',
              confirmText: 'Удалить',
              onConfirm: () => {
                const workouts = AppState.userWorkouts.filter(w => w.id !== workoutId);
                const calendar = { ...AppState.calendar };
                
                // Remove from calendar
                Object.keys(calendar).forEach(date => {
                  if (calendar[date].workoutId === workoutId) {
                    delete calendar[date];
                  }
                });
                
                Storage.set(Storage.KEYS.WORKOUTS, workouts);
                Storage.set(Storage.KEYS.CALENDAR, calendar);
                
                AppState.update({
                  userWorkouts: workouts,
                  calendar,
                  modal: null
                });
              }
            }
          });
        });
      });
      
      // Modal
      document.getElementById('modal-backdrop')?.addEventListener('click', (e) => {
        if (e.target.id === 'modal-backdrop') {
          AppState.update({ modal: null });
        }
      });
      
      document.getElementById('modal-close')?.addEventListener('click', () => {
        AppState.update({ modal: null });
      });
      
      document.getElementById('modal-confirm')?.addEventListener('click', () => {
        const modal = AppState.modal;
        if (modal?.onConfirm) {
          modal.onConfirm();
        }
      });
    }
    
    function finishWorkoutSession() {
      const session = AppState.activeSession;
      if (!session) return;
      
      const completedCount = session.exercises.filter(e => e.completed).length;
      const totalCount = session.exercises.length;
      const progress = Math.round((completedCount / totalCount) * 100);
      const completed = progress >= 100;
      
      // Update calendar
      const calendar = { ...AppState.calendar };
      if (session.date) {
        calendar[session.date] = {
          workoutId: session.workoutId,
          completed,
          progress
        };
      }
      
      // Update history
      const history = [...(AppState.history || [])];
      history.push({
        workoutId: session.workoutId,
        date: session.date || getDateKey(new Date()),
        completed,
        progress,
        exercisesCompleted: completedCount,
        timestamp: Date.now()
      });
      
      Storage.set(Storage.KEYS.CALENDAR, calendar);
      Storage.set(Storage.KEYS.HISTORY, history);
      
      AppState.update({
        calendar,
        history,
        currentView: 'main',
        activeSession: null,
        modal: null,
        currentTab: 'calendar'
      });
    }
    
    // ==========================================
    // INITIALIZATION
    // ==========================================
    
    function init() {
      initializeState();
      AppState.subscribe(renderApp);
      renderApp();
    }
    
    // Start app
    document.addEventListener('DOMContentLoaded', init);
    
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'fitplanner-v1';
        const urlsToCache = ['/'];
        
        self.addEventListener('install', event => {
          event.waitUntil(
            caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache))
          );
        });
        
        self.addEventListener('fetch', event => {
          event.respondWith(
            caches.match(event.request).then(response => {
              return response || fetch(event.request);
            })
          );
        });
      `;
      
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }
  </script>
</body>
</html>
