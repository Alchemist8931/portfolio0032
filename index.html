<html lang="ru">

  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Продвинутое приложение для планирования и отслеживания тренировок">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

      theme: {
        extend: {
          fontFamily: {
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          },
          colors: {
            lime: {
              350: '#a3e635',
              450: '#8bc926',
            }
          }
        }
      }
    }

  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-elevated: #171717;
      --bg-card: rgba(23, 23, 23, 0.8);
      --border-subtle: rgba(115, 115, 115, 0.2);
      --border-medium: rgba(115, 115, 115, 0.4);
      --accent-lime: #a3e635;
      --accent-lime-dim: rgba(163, 230, 53, 0.1);
      --text-primary: #fafafa;
      --text-secondary: #a3a3a3;
      --text-muted: #737373;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    
    html {
      scroll-behavior: smooth;
    }
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      min-height: 100vh;
      min-height: 100dvh;
    }
    
    .font-mono {
      font-family: 'IBM Plex Mono', monospace;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { 
      background: rgba(163, 230, 53, 0.3); 
      border-radius: 2px; 
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(163, 230, 53, 0.5); }
    
    /* Aurora Glow Effect */
    .aurora-glow {
      position: absolute;
      width: 100%;
      height: 300px;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(163, 230, 53, 0.12) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      transition: all 0.8s ease;
    }
    
    .aurora-glow.active {
      background: radial-gradient(circle, rgba(163, 230, 53, 0.18) 0%, transparent 70%);
    }
    
    /* Card Styles */
    .card-core {
      background: #0f0f0f;
      border: 1px solid rgba(115, 115, 115, 0.15);
      border-radius: 1rem;
      overflow: hidden;
      position: relative;
    }
    
    .card-core::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 50%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(163, 230, 53, 0.5), transparent);
    }
    
    /* Input Styles */
    .input-core {
      background: rgba(10, 10, 10, 0.6);
      border: 1px solid rgba(115, 115, 115, 0.2);
      border-radius: 0.75rem;
      padding: 0.875rem 1rem;
      color: var(--text-primary);
      font-size: 0.9375rem;
      transition: all 0.25s ease;
      width: 100%;
    }
    
    .input-core:focus {
      outline: none;
      border-color: var(--accent-lime);
      box-shadow: 0 0 0 3px rgba(163, 230, 53, 0.1);
    }
    
    .input-core::placeholder {
      color: var(--text-muted);
    }
    
    /* Button Styles */
    .btn-lime {
      background: var(--accent-lime);
      color: #0a0a0a;
      font-weight: 600;
      padding: 0.875rem 1.5rem;
      border-radius: 0.75rem;
      transition: all 0.25s ease;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    
    .btn-lime::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    
    .btn-lime:hover::before {
      opacity: 1;
    }
    
    .btn-lime:active {
      transform: scale(0.98);
    }
    
    .btn-outline {
      background: transparent;
      color: var(--accent-lime);
      font-weight: 500;
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(163, 230, 53, 0.4);
      transition: all 0.25s ease;
      cursor: pointer;
    }
    
    .btn-outline:hover {
      background: var(--accent-lime);
      color: #0a0a0a;
    }
    
    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      padding: 0.625rem;
      border-radius: 0.625rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .btn-ghost:hover {
      background: rgba(163, 230, 53, 0.1);
      color: var(--accent-lime);
    }
    
    /* Custom Checkbox */
    .checkbox-core {
      appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid rgba(115, 115, 115, 0.4);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      flex-shrink: 0;
    }
    
    .checkbox-core:checked {
      background: var(--accent-lime);
      border-color: var(--accent-lime);
    }
    
    .checkbox-core:checked::after {
      content: '';
      position: absolute;
      left: 6px;
      top: 2px;
      width: 6px;
      height: 11px;
      border: solid #0a0a0a;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    
    .checkbox-core:focus-visible {
      outline: 2px solid var(--accent-lime);
      outline-offset: 2px;
    }
    
    /* Pulse Animation */
    @keyframes pulse-strong {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.8); opacity: 0; }
    }
    
    .pulse-strong {
      animation: pulse-strong 2s ease-in-out infinite;
    }
    
    /* Fade In Up Animation */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .animate-in {
      animation: fadeInUp 0.4s ease forwards;
    }
    
    .stagger-1 { animation-delay: 0.05s; }
    .stagger-2 { animation-delay: 0.1s; }
    .stagger-3 { animation-delay: 0.15s; }
    .stagger-4 { animation-delay: 0.2s; }
    .stagger-5 { animation-delay: 0.25s; }
    
    /* Page Transition */
    .page-transition {
      animation: pageSlide 0.35s ease forwards;
    }
    
    @keyframes pageSlide {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    /* Progress Ring */
    .progress-ring {
      transform: rotate(-90deg);
    }
    
    .progress-ring-circle {
      transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* Mini Chart Animation */
    @keyframes chartDraw {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
    
    .chart-line {
      stroke-dasharray: 400;
      animation: chartDraw 1.5s ease forwards;
    }
    
    /* Floating Particles */
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(163, 230, 53, 0.6);
      border-radius: 50%;
      pointer-events: none;
    }
    
    @keyframes float-particle {
      0%, 100% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% {
        transform: translateY(-100px) translateX(20px);
        opacity: 0;
      }
    }
    
    /* Skeleton */
    .skeleton {
      background: linear-gradient(90deg, 
        rgba(115, 115, 115, 0.1) 0%, 
        rgba(115, 115, 115, 0.15) 50%, 
        rgba(115, 115, 115, 0.1) 100%
      );
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 0.5rem;
    }
    
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    /* Calendar Day */
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.625rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      color: var(--text-secondary);
    }
    
    .calendar-day:hover {
      background: rgba(163, 230, 53, 0.08);
    }
    
    .calendar-day.current-month {
      color: var(--text-primary);
    }
    
    .calendar-day.today {
      background: rgba(163, 230, 53, 0.15);
      color: var(--accent-lime);
    }
    
    .calendar-day.selected {
      background: var(--accent-lime);
      color: #0a0a0a;
    }
    
    .calendar-day.has-workout::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-lime);
    }
    
    .calendar-day.selected.has-workout::after {
      background: #0a0a0a;
    }
    
    /* Modal */
    .modal-overlay {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
    }
    
    .modal-content {
      animation: modalEnter 0.3s ease;
    }
    
    @keyframes modalEnter {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    
    /* Nav Indicator */
    .nav-indicator {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent-lime);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    
    .nav-item.active .nav-indicator {
      opacity: 1;
    }
    
    /* Workout Card Hover */
    .workout-card-item {
      transition: all 0.25s ease;
    }
    
    .workout-card-item:hover {
      border-color: rgba(163, 230, 53, 0.3);
      transform: translateY(-2px);
    }
    
    /* Tag Styles */
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.625rem;
      border-radius: 0.375rem;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .tag-lime {
      background: rgba(163, 230, 53, 0.15);
      color: var(--accent-lime);
      border: 1px solid rgba(163, 230, 53, 0.2);
    }
    
    .tag-neutral {
      background: rgba(115, 115, 115, 0.15);
      color: var(--text-secondary);
      border: 1px solid rgba(115, 115, 115, 0.2);
    }
    
    .tag-success {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
    
    .tag-warning {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    
    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    
    /* Safe Area for Mobile */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
  </style>
</head>

    ];
    
    const CATEGORIES = [...new Set(EXERCISES_DB.map(e => e.category))];
    
    // ==========================================
    // STORAGE MANAGER
    // ==========================================
    
    const Storage = {
      KEYS: {
        AUTH: 'fitcore_auth',
        WORKOUTS: 'fitcore_workouts',
        CALENDAR: 'fitcore_calendar',
        HISTORY: 'fitcore_history',
        SETTINGS: 'fitcore_settings'
      },
      
      get(key, defaultValue = null) {
        try {
          const data = localStorage.getItem(key);
          return data ? JSON.parse(data) : defaultValue;
        } catch {
          return defaultValue;
        }
      },
      
      set(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch {
          return false;
        }
      },
      
      remove(key) {
        localStorage.removeItem(key);
      }
    };
    
    // ==========================================
    // STATE MANAGEMENT
    // ==========================================
    
    const State = {
      // Auth
      isAuthenticated: false,
      user: null,
      
      // View
      view: 'auth', // auth, main, builder, session
      tab: 'dashboard', // dashboard, workouts, calendar, stats
      modal: null,
      
      // Data
      workouts: [],
      calendar: {},
      history: [],
      settings: {
        restTime: 90,
        weightUnit: 'kg',
        notifications: true
      },
      
      // UI State
      selectedDate: null,
      calendarMonth: new Date(),
      editingWorkout: null,
      activeSession: null,
      exerciseSearch: '',
      selectedCategory: 'all',
      isLoading: false,
      
      // Subscribers
      listeners: new Set(),
      
      subscribe(fn) {
        this.listeners.add(fn);
        return () => this.listeners.delete(fn);
      },
      
      update(changes) {
        Object.assign(this, changes);
        this.listeners.forEach(fn => fn(this));
      },
      
      persist() {
        Storage.set(Storage.KEYS.WORKOUTS, this.workouts);
        Storage.set(Storage.KEYS.CALENDAR, this.calendar);
        Storage.set(Storage.KEYS.HISTORY, this.history);
        Storage.set(Storage.KEYS.SETTINGS, this.settings);
      }
    };
    
    // Initialize
    function initializeApp() {
      const auth = Storage.get(Storage.KEYS.AUTH);
      const workouts = Storage.get(Storage.KEYS.WORKOUTS, []);
      const calendar = Storage.get(Storage.KEYS.CALENDAR, {});
      const history = Storage.get(Storage.KEYS.HISTORY, []);
      const settings = Storage.get(Storage.KEYS.SETTINGS, State.settings);
      
      State.update({
        isAuthenticated: auth?.isAuthenticated || false,
        user: auth?.user || null,
        view: auth?.isAuthenticated ? 'main' : 'auth',
        workouts,
        calendar,
        history,
        settings
      });
    }
    
    // ==========================================
    // UTILITIES
    // ==========================================
    
    const Utils = {
      uid: () => `id_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`,
      
      dateKey: (date) => {
        const d = new Date(date);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      },
      
      formatDate: (date) => {
        return new Date(date).toLocaleDateString('ru-RU', { 
          day: 'numeric', 
          month: 'short' 
        });
      },
      
      formatDateFull: (date) => {
        return new Date(date).toLocaleDateString('ru-RU', { 
          weekday: 'long', 
          day: 'numeric', 
          month: 'long' 
        });
      },
      
      getMonthDays: (year, month) => {
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const days = [];
        
        let startPadding = firstDay.getDay() - 1;
        if (startPadding < 0) startPadding = 6;
        
        for (let i = startPadding; i > 0; i--) {
          const d = new Date(year, month, 1 - i);
          days.push({ date: d, currentMonth: false });
        }
        
        for (let i = 1; i <= lastDay.getDate(); i++) {
          days.push({ date: new Date(year, month, i), currentMonth: true });
        }
        
        const remaining = 42 - days.length;
        for (let i = 1; i <= remaining; i++) {
          days.push({ date: new Date(year, month + 1, i), currentMonth: false });
        }
        
        return days;
      },
      
      debounce: (fn, delay) => {
        let timeout;
        return (...args) => {
          clearTimeout(timeout);
          timeout = setTimeout(() => fn(...args), delay);
        };
      },
      
      calculateStreak: (calendar) => {
        let streak = 0;
        const today = new Date();
        
        for (let i = 0; i < 365; i++) {
          const d = new Date(today);
          d.setDate(d.getDate() - i);
          const key = Utils.dateKey(d);
          
          if (calendar[key]?.completed) {
            streak++;
          } else if (i > 0) {
            break;
          }
        }
        
        return streak;
      },
      
      getWeekStats: (history) => {
        const now = new Date();
        const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
        
        return history.filter(h => new Date(h.timestamp) >= weekAgo);
      }
    };

    // ==========================================
    // CALENDAR TAB
    // ==========================================
    
    function renderCalendar() {
      const viewDate = State.calendarMonth || new Date();
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      const days = Utils.getMonthDays(year, month);
      const todayKey = Utils.dateKey(new Date());
      
      const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 
                          'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
      const weekDays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      
      return `
        <div class="page-transition">
          <div class="mb-5 animate-in">
            <h1 class="font-display text-xl font-bold text-neutral-100 mb-1">Календарь</h1>
            <p class="text-sm text-neutral-500">Планируйте тренировки</p>
          </div>
          
          <div class="card-core p-4 animate-in stagger-1">
            <!-- Month Navigation -->
            <div class="flex items-center justify-between mb-4">
              <button id="prev-month" class="btn-ghost p-2">
                <span class="w-5 h-5">${Icons.chevronLeft}</span>
              </button>
              
              <h2 class="font-display font-semibold text-neutral-100">
                ${monthNames[month]} ${year}
              </h2>
              
              <button id="next-month" class="btn-ghost p-2">
                <span class="w-5 h-5">${Icons.chevronRight}</span>
              </button>
            </div>
            
            <!-- Week Days -->
            <div class="grid grid-cols-7 gap-1 mb-2">
              ${weekDays.map(d => `<div class="text-center text-xs text-neutral-500 font-medium py-2">${d}</div>`).join('')}
            </div>
            
            <!-- Days Grid -->
            <div class="grid grid-cols-7 gap-1">
              ${days.map(({ date, currentMonth }) => {
                const dateKey = Utils.dateKey(date);
                const isToday = dateKey === todayKey;
                const isSelected = State.selectedDate === dateKey;
                const plan = State.calendar[dateKey];
                
                return `
                  <button 
                    class="calendar-day ${currentMonth ? 'current-month' : ''} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''} ${plan ? 'has-workout' : ''}"
                    data-date="${dateKey}"
                  >
                    ${date.getDate()}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
          
          <!-- Selected Date Info -->
          ${State.selectedDate ? renderSelectedDate() : ''}
        </div>
      `;
    }
    
    function renderSelectedDate() {
      const dateKey = State.selectedDate;
      const plan = State.calendar[dateKey];
      
      return `
        <div class="card-core p-4 mt-4 animate-in stagger-2">
          <div class="flex items-center justify-between mb-4 border-b border-neutral-800 pb-4">
            <p class="font-medium text-neutral-200 capitalize">${Utils.formatDateFull(dateKey)}</p>
            ${plan ? `
              <span class="tag ${plan.completed ? 'tag-success' : 'tag-lime'}">
                ${plan.completed ? 'Готово' : 'Запланировано'}
              </span>
            ` : ''}
          </div>
          
          ${plan ? `
            ${(() => {
              const workout = State.workouts.find(w => w.id === plan.workoutId);
              if (!workout) return '<p class="text-neutral-500 text-sm">Тренировка удалена</p>';
              
              return `
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-lime-400/10 flex items-center justify-center">
                      <span class="w-5 h-5 text-lime-400">${Icons.dumbbell}</span>
                    </div>
                    <div>
                      <h4 class="font-medium text-neutral-100">${workout.name}</h4>

                  </div>
                  
                  ${!plan.completed ? `
                    <button class="btn-lime py-2 px-4 text-sm flex items-center gap-2" data-start="${plan.workoutId}" data-date="${dateKey}">
                      <span class="w-4 h-4">${Icons.play}</span>

                  ` : `
                    <div class="text-right">

                    </div>

                </div>
              `;

          ` : `
            <div class="text-center py-2">
              <p class="text-neutral-500 text-sm mb-3">Нет тренировки</p>
              <button class="btn-outline text-sm py-2" data-assign="${dateKey}">
                Назначить
              </button>
            </div>
          `}
        </div>
      `;
    }
    
    // ==========================================
    // STATS TAB
    // ==========================================
    
    function renderStats() {
      const history = State.history || [];
      const completed = history.filter(h => h.completed);
      const totalExercises = history.reduce((sum, h) => sum + (h.exercisesCompleted || 0), 0);
      const streak = Utils.calculateStreak(State.calendar);
      
      // Last 30 days chart
      const last30 = [];
      for (let i = 29; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = Utils.dateKey(d);
        last30.push(State.calendar[key]?.completed ? 1 : 0);
      }
      
      const chartPoints = last30.map((v, i) => {
        const x = (i / 29) * 300;
        const y = 60 - v * 50;
        return `${x},${y}`;
      }).join(' ');
      
      return `
        <div class="page-transition">
          <div class="mb-5 animate-in">
            <h1 class="font-display text-xl font-bold text-neutral-100 mb-1">Статистика</h1>
            <p class="text-sm text-neutral-500">Ваш прогресс</p>
          </div>
          
          <!-- Stats Grid -->
          <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="card-core p-4 animate-in stagger-1">
              <div class="w-9 h-9 rounded-lg bg-lime-400/10 flex items-center justify-center mb-3">
                <span class="w-5 h-5 text-lime-400">${Icons.fire}</span>
              </div>
              <p class="font-display text-2xl font-bold text-neutral-100">${streak}</p>
              <p class="text-xs text-neutral-500">Дней подряд</p>
            </div>
            
            <div class="card-core p-4 animate-in stagger-2">
              <div class="w-9 h-9 rounded-lg bg-lime-400/10 flex items-center justify-center mb-3">
                <span class="w-5 h-5 text-lime-400">${Icons.target}</span>
              </div>
              <p class="font-display text-2xl font-bold text-neutral-100">${completed.length}</p>
              <p class="text-xs text-neutral-500">Тренировок</p>
            </div>
            
            <div class="card-core p-4 animate-in stagger-3">
              <div class="w-9 h-9 rounded-lg bg-lime-400/10 flex items-center justify-center mb-3">
                <span class="w-5 h-5 text-lime-400">${Icons.check}</span>
              </div>
              <p class="font-display text-2xl font-bold text-neutral-100">${totalExercises}</p>
              <p class="text-xs text-neutral-500">Упражнений</p>
            </div>
            
            <div class="card-core p-4 animate-in stagger-4">
              <div class="w-9 h-9 rounded-lg bg-lime-400/10 flex items-center justify-center mb-3">
                <span class="w-5 h-5 text-lime-400">${Icons.dumbbell}</span>
              </div>
              <p class="font-display text-2xl font-bold text-neutral-100">${State.workouts.length}</p>
              <p class="text-xs text-neutral-500">Программ</p>
            </div>
          </div>
          
          <!-- 30 Day Chart -->
          <div class="card-core p-5 animate-in stagger-5">
            <p class="font-medium text-neutral-200 mb-4">Последние 30 дней</p>
            <div class="relative h-20">
              <svg class="h-full w-full" viewBox="0 0 300 80" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="chart-gradient-30" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#a3e635" stop-opacity="0.2"></stop>
                    <stop offset="100%" stop-color="#a3e635" stop-opacity="0"></stop>
                  </linearGradient>
                </defs>
                <polyline 
                  points="${chartPoints}"
                  fill="none" 
                  stroke="#a3e635" 
                  stroke-width="2"
                  class="chart-line"
                ></polyline>
              </svg>
            </div>
          </div>
          
          <!-- Recent Activity -->
          <div class="card-core p-5 mt-4 animate-in stagger-5">
            <p class="font-medium text-neutral-200 mb-4">Последняя активность</p>
            
            ${history.length === 0 ? `
              <p class="text-neutral-500 text-sm text-center py-4">История пуста</p>
            ` : `
              <div class="space-y-3">
                ${history.slice(-5).reverse().map(h => {
                  const workout = State.workouts.find(w => w.id === h.workoutId);
                  return `
                    <div class="flex items-center justify-between py-2 border-b border-neutral-800 last:border-0">
                      <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg ${h.completed ? 'bg-lime-400/10' : 'bg-orange-400/10'} flex items-center justify-center">
                          <span class="w-4 h-4 ${h.completed ? 'text-lime-400' : 'text-orange-400'}">
                            ${h.completed ? Icons.check : Icons.timer}
                          </span>
                        </div>
                        <div>
                          <p class="text-sm text-neutral-200">${workout?.name || 'Тренировка'}</p>
                          <p class="text-xs text-neutral-500">${Utils.formatDate(h.date)}</p>
                        </div>
                      </div>
                      <span class="text-sm text-neutral-400">${h.progress}%</span>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }
    
    // ==========================================

                  <p class="text-xs font-medium text-neutral-500 mb-3">Добавлено: ${workout.exercises.length}</p>
                  <div class="space-y-2">
                    ${workout.exercises.map((ex, i) => {
                      const exercise = EXERCISES_DB.find(e => e.id === ex.exerciseId);

                      return `
                        <div class="card-core p-4 animate-in stagger-${Math.min(i + 1, 5)}">
                          <div class="flex items-start justify-between mb-3">

                              <h4 class="font-medium text-neutral-100">${exercise.name}</h4>
                              <span class="text-xs text-neutral-500">${exercise.category}</span>
                            </div>
                            <button class="btn-ghost p-1.5 hover:bg-red-500/10 hover:text-red-400" data-remove="${i}">
                              <span class="w-4 h-4">${Icons.x}</span>
                            </button>
                          </div>
                          
                          <div class="grid grid-cols-3 gap-2">
                            <div>
                              <label class="text-xs text-neutral-500 mb-1 block">Подходы</label>
                              <input 
                                type="number" 
                                min="1"

                                class="input-core py-2 text-sm text-center"

              <!-- Search -->
              <div class="relative mb-4">

                      </div>
                    </button>

                }).join('')}
              </div>
            </div>
          </main>
        </div>
      `;
    }
    
    // ==========================================
    // WORKOUT SESSION
    // ==========================================
    
    function renderSession() {
      const session = State.activeSession;
      if (!session) return '';
      
      const workout = State.workouts.find(w => w.id === session.workoutId);
      if (!workout) return '';
      
      const completed = session.exercises.filter(e => e.completed).length;
      const total = session.exercises.length;
      const progress = Math.round((completed / total) * 100);
      
      return `
        <div class="min-h-screen flex flex-col relative z-10">
          <!-- Header -->
          <header class="bg-neutral-950/95 backdrop-blur-xl border-b border-neutral-800 px-4 py-3 sticky top-0 z-20">

                  <span class="w-5 h-5">${Icons.x}</span>

                <div class="flex items-center gap-3">
                  <span class="font-display text-2xl font-bold text-lime-400">${progress}%</span>

              <!-- Progress Bar -->

              </div>
              
              <div class="flex justify-between mt-2 text-xs text-neutral-500">

                <span>${completed} из ${total}</span>

                            ${workoutEx?.weight ? `
                              <div class="flex items-center gap-1.5">
                                <span class="w-6 h-6 rounded bg-lime-400/10 flex items-center justify-center">
                                  <span class="text-xs font-bold text-lime-400">${workoutEx.weight}</span>
                                </span>
                                <span class="text-xs text-neutral-500">кг</span>
                              </div>
                            ` : ''}
                          </div>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </main>
        </div>
      `;
    }
    
    // ==========================================
    // MODAL
    // ==========================================
    
    function renderModal() {
      const modal = State.modal;
      if (!modal) return '';
      
      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay" id="modal-overlay">
          <div class="card-core p-6 max-w-sm w-full modal-content">
            ${modal.type === 'assign' ? `
              <h3 class="font-medium text-neutral-100 mb-4">Выберите программу</h3>
              
              ${State.workouts.length === 0 ? `
                <p class="text-neutral-500 text-sm mb-4">Сначала создайте программу</p>
                <button id="modal-close" class="btn-lime w-full">Понятно</button>
              ` : `
                <div class="space-y-2 max-h-60 overflow-y-auto mb-4">
                  ${State.workouts.map(w => `
                    <button 
                      class="w-full card-core p-3 text-left hover:border-lime-400/30 transition-all"
                      data-select="${w.id}"
                    >
                      <span class="font-medium text-neutral-100">${w.name}</span>
                      <span class="text-xs text-neutral-500 ml-2">${w.exercises.length} упр.</span>
                    </button>
                  `).join('')}
                </div>
                <button id="modal-close" class="btn-outline w-full">Отмена</button>
              `}
            ` : ''}
            
            ${modal.type === 'confirm' ? `
              <h3 class="font-medium text-neutral-100 mb-2">${modal.title}</h3>
              <p class="text-neutral-500 text-sm mb-6">${modal.message}</p>
              
              <div class="flex gap-3">
                <button id="modal-close" class="btn-outline flex-1">Отмена</button>
                <button id="modal-confirm" class="btn-lime flex-1">${modal.confirmText || 'Подтвердить'}</button>
              </div>
            ` : ''}
            
            ${modal.type === 'exit-session' ? `
              <h3 class="font-medium text-neutral-100 mb-2">Завершить тренировку?</h3>
              <p class="text-neutral-500 text-sm mb-6">Прогресс будет сохранен</p>
              
              <div class="flex gap-3">
                <button id="modal-close" class="btn-outline flex-1">Продолжить</button>
                <button id="exit-confirm" class="btn-lime flex-1">Завершить</button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }
    
    // ==========================================
    // EVENT HANDLERS
    // ==========================================
    
    function attachEvents() {
      // Auth
      const authForm = document.getElementById('auth-form');
      if (authForm) {
        authForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          State.update({ isLoading: true });
          
          await new Promise(r => setTimeout(r, 1200));
          
          const email = document.getElementById('auth-email')?.value || 'user@example.com';
          
          Storage.set(Storage.KEYS.AUTH, {
            isAuthenticated: true,
            user: { email, name: email.split('@')[0] }
          });
          
          State.update({
            isAuthenticated: true,
            user: { email, name: email.split('@')[0] },
            view: 'main',
            isLoading: false
          });
        });
        
        document.getElementById('register-btn')?.addEventListener('click', () => {
          authForm.dispatchEvent(new Event('submit'));
        });
      }
      
      // Logout
      document.getElementById('logout-btn')?.addEventListener('click', () => {
        Storage.remove(Storage.KEYS.AUTH);
        State.update({ isAuthenticated: false, user: null, view: 'auth' });
      });
      
      // Tab Navigation
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
          State.update({ tab: btn.dataset.tab });
        });
      });
      
      // FAB
      document.getElementById('fab-add')?.addEventListener('click', () => {
        State.update({
          view: 'builder',
          editingWorkout: { name: '', exercises: [] },
          exerciseSearch: '',
          selectedCategory: 'all'
        });
      });
      
      document.getElementById('create-first')?.addEventListener('click', () => {
        State.update({
          view: 'builder',
          editingWorkout: { name: '', exercises: [] },
          exerciseSearch: '',
          selectedCategory: 'all'
        });
      });
      
      document.getElementById('plan-today')?.addEventListener('click', () => {
        State.update({
          modal: {
            type: 'assign',
            date: Utils.dateKey(new Date())
          }
        });
      });
      
      // Builder
      document.getElementById('back-builder')?.addEventListener('click', () => {
        State.update({ view: 'main', editingWorkout: null });
      });
      
      document.getElementById('workout-name')?.addEventListener('input', (e) => {
        if (State.editingWorkout) {
          State.editingWorkout.name = e.target.value;
          State.notify();
        }
      });
      
      document.getElementById('save-workout')?.addEventListener('click', () => {
        const workout = State.editingWorkout;
        if (workout?.name.trim() && workout.exercises.length > 0) {
          const workouts = [...State.workouts];
          
          if (workout.id) {
            const idx = workouts.findIndex(w => w.id === workout.id);
            if (idx !== -1) workouts[idx] = workout;
          } else {
            workout.id = Utils.uid();
            workouts.push(workout);
          }
          
          State.update({ workouts });
          State.persist();
          State.update({ view: 'main', editingWorkout: null });
        }
      });
      
      // Exercise Search
      const searchInput = document.getElementById('exercise-search');
      if (searchInput) {
        searchInput.addEventListener('input', Utils.debounce((e) => {
          State.update({ exerciseSearch: e.target.value });
        }, 150));
      }
      
      // Category Filter
      document.querySelectorAll('[data-cat]').forEach(btn => {
        btn.addEventListener('click', () => {
          State.update({ selectedCategory: btn.dataset.cat });
        });
      });
      
      // Add Exercise
      document.querySelectorAll('[data-add]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.add);
          const workout = State.editingWorkout;
          
          if (workout && !workout.exercises.some(e => e.exerciseId === id)) {
            workout.exercises.push({
              exerciseId: id,
              sets: 3,
              reps: '10-12',
              weight: null
            });
            State.notify();
          }
        });
      });
      
      // Remove Exercise
      document.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.remove);
          const workout = State.editingWorkout;
          
          if (workout) {
            workout.exercises.splice(idx, 1);
            State.notify();
          }
        });
      });
      
      // Exercise Fields
      document.querySelectorAll('[data-ex]').forEach(input => {
        input.addEventListener('input', (e) => {
          const idx = parseInt(e.target.dataset.ex);
          const field = e.target.dataset.field;
          const workout = State.editingWorkout;
          
          if (workout?.exercises[idx]) {
            if (field === 'sets' || field === 'weight') {
              workout.exercises[idx][field] = parseFloat(e.target.value) || null;
            } else {
              workout.exercises[idx][field] = e.target.value;
            }
          }
        });
      });
      
      // Calendar Navigation
      document.getElementById('prev-month')?.addEventListener('click', () => {
        const d = new Date(State.calendarMonth);
        d.setMonth(d.getMonth() - 1);
        State.update({ calendarMonth: d });
      });
      
      document.getElementById('next-month')?.addEventListener('click', () => {
        const d = new Date(State.calendarMonth);
        d.setMonth(d.getMonth() + 1);
        State.update({ calendarMonth: d });
      });
      
      // Calendar Day
      document.querySelectorAll('.calendar-day').forEach(day => {
        day.addEventListener('click', () => {
          State.update({ selectedDate: day.dataset.date });
        });
      });
      
      // Assign Workout
      document.querySelectorAll('[data-assign]').forEach(btn => {
        btn.addEventListener('click', () => {
          State.update({
            modal: {
              type: 'assign',
              date: btn.dataset.assign
            }
          });
        });
      });
      
      // Select Workout for Calendar
      document.querySelectorAll('[data-select]').forEach(btn => {
        btn.addEventListener('click', () => {
          const workoutId = btn.dataset.select;
          const date = State.modal?.date;
          
          if (date && workoutId) {
            const calendar = { ...State.calendar };
            calendar[date] = {
              workoutId,
              completed: false,
              progress: 0
            };
            
            State.update({ calendar });
            State.persist();
            State.update({ modal: null });
          }
        });
      });
      
      // Start Workout
      document.querySelectorAll('[data-start], [data-start-today]').forEach(btn => {
        btn.addEventListener('click', () => {
          const workoutId = btn.dataset.start || btn.dataset.startToday;
          const date = btn.dataset.date || Utils.dateKey(new Date());
          const workout = State.workouts.find(w => w.id === workoutId);
          
          if (workout) {
            State.update({
              view: 'session',
              activeSession: {
                workoutId,
                date,
                exercises: workout.exercises.map(e => ({
                  exerciseId: e.exerciseId,
                  completed: false
                })),
                startTime: Date.now()
              }
            });
          }
        });
      });
      
      // Session
      document.getElementById('exit-session')?.addEventListener('click', () => {
        State.update({ modal: { type: 'exit-session' } });
      });
      
      document.getElementById('exit-confirm')?.addEventListener('click', () => {
        finishSession();
      });
      
      document.getElementById('finish-session')?.addEventListener('click', () => {
        finishSession();
      });
      
      // Toggle Exercise in Session
      document.querySelectorAll('[data-toggle]').forEach(cb => {
        cb.addEventListener('change', () => {
          const idx = parseInt(cb.dataset.toggle);
          const session = State.activeSession;
          
          if (session?.exercises[idx]) {
            session.exercises[idx].completed = cb.checked;
            State.notify();
          }
        });
      });
      
      // Workout Actions
      document.querySelectorAll('.workout-card-item').forEach(card => {
        card.addEventListener('click', (e) => {
          if (!e.target.closest('.workout-edit') && !e.target.closest('.workout-delete')) {
            const id = card.dataset.workoutId;
            const workout = State.workouts.find(w => w.id === id);
            
            if (workout) {
              State.update({
                view: 'builder',
                editingWorkout: JSON.parse(JSON.stringify(workout)),
                exerciseSearch: '',
                selectedCategory: 'all'
              });
            }
          }
        });
      });
      
      document.querySelectorAll('.workout-edit').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.workoutId;
          const workout = State.workouts.find(w => w.id === id);
          
          if (workout) {
            State.update({
              view: 'builder',
              editingWorkout: JSON.parse(JSON.stringify(workout)),
              exerciseSearch: '',
              selectedCategory: 'all'
            });
          }
        });
      });
      
      document.querySelectorAll('.workout-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.workoutId;
          
          State.update({
            modal: {
              type: 'confirm',
              title: 'Удалить программу?',
              message: 'Это действие нельзя отменить.',
              confirmText: 'Удалить',
              onConfirm: () => {
                const workouts = State.workouts.filter(w => w.id !== id);
                const calendar = { ...State.calendar };
                
                Object.keys(calendar).forEach(date => {
                  if (calendar[date].workoutId === id) delete calendar[date];
                });
                
                State.update({ workouts, calendar, modal: null });
                State.persist();
              }
            }
          });
        });
      });
      
      // Modal
      document.getElementById('modal-overlay')?.addEventListener('click', (e) => {
        if (e.target.id === 'modal-overlay') {
          State.update({ modal: null });
        }
      });
      
      document.getElementById('modal-close')?.addEventListener('click', () => {
        State.update({ modal: null });
      });
      
      document.getElementById('modal-confirm')?.addEventListener('click', () => {
        if (State.modal?.onConfirm) {
          State.modal.onConfirm();
        }
      });
    }
    
    function finishSession() {
      const session = State.activeSession;
      if (!session) return;
      
      const completed = session.exercises.filter(e => e.completed).length;
      const total = session.exercises.length;
      const progress = Math.round((completed / total) * 100);
      const isCompleted = progress >= 100;
      
      // Update calendar
      const calendar = { ...State.calendar };
      if (session.date) {
        calendar[session.date] = {
          workoutId: session.workoutId,
          completed: isCompleted,
          progress
        };
      }
      
      // Update history
      const history = [...State.history];
      history.push({
        workoutId: session.workoutId,
        date: session.date || Utils.dateKey(new Date()),
        completed: isCompleted,
        progress,
        exercisesCompleted: completed,
        timestamp: Date.now()
      });
      
      State.update({
        calendar,
        history,
        view: 'main',
        activeSession: null,
        modal: null,
        tab: 'dashboard'
      });
      
      State.persist();
    }
    
    // ==========================================
    // INIT
    // ==========================================
    
    function init() {
      initializeApp();
      State.subscribe(render);
      render();
    }
    
    document.addEventListener('DOMContentLoaded', init);
    
    // Service Worker
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE = 'fitcore-v1';
        self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/']))));
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }
  </script>
</body>
</html>
